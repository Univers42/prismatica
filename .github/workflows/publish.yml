# ================================================================
# Prismatica (opposite-osiris) — Build & Push Docker Images to ghcr.io
# ================================================================
# Triggers on:
#   - Push to main (tagged as :main / :latest)
#   - Push tags like v1.0.0, v0.2.3, etc.
#   - Manual dispatch
#
# Publishes two public images:
#   ghcr.io/univers42/prismatica-web
#   ghcr.io/univers42/prismatica-auth-gateway
#
# Both Dockerfiles (docker/services/web, docker/services/api-gateway) are
# written for a build context at the ft_transcendence monorepo ROOT, with this
# repo nested at `apps/opposite-osiris` (see the Dockerfiles' own header
# comments and docker/services/*/README.md for the equivalent local command).
# Checking out this repo into that same relative path reproduces that layout
# without forking the Dockerfiles into a standalone-repo variant.
# ================================================================

name: Build & Push Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/univers42

jobs:
  test-gate:
    name: 🧪 Run Test Gate
    runs-on: ubuntu-latest
    container: node:22-alpine
    env:
      TRACK_BINOCLE_IN_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          corepack enable && corepack prepare pnpm@11.5.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: node_modules/.bin/astro check
      - name: Test
        run: pnpm test

  build-web:
    name: 🐳 Build web (opposite-osiris)
    runs-on: ubuntu-latest
    needs: [test-gate]
    steps:
      - name: Checkout into apps/opposite-osiris
        uses: actions/checkout@v4
        with:
          path: apps/opposite-osiris

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/prismatica-web
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/opposite-osiris/docker/services/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-auth-gateway:
    name: 🐳 Build auth-gateway
    runs-on: ubuntu-latest
    needs: [test-gate]
    steps:
      - name: Checkout into apps/opposite-osiris
        uses: actions/checkout@v4
        with:
          path: apps/opposite-osiris

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/prismatica-auth-gateway
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push auth-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/opposite-osiris/docker/services/api-gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

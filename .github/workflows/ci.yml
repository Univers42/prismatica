name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: 🧪 Quality Gate
    runs-on: ubuntu-latest
    container: node:22-alpine
    env:
      TRACK_BINOCLE_IN_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          corepack enable && corepack prepare pnpm@11.5.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: node_modules/.bin/astro check

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

  # Production deploys are triggered from here, after the gate, through a Vercel deploy hook (a
  # secret URL; a CLI login cannot mint API tokens). The hook always builds the head of main —
  # Vercel's Git integration made no new deployment when main was force-pushed back to an
  # already-deployed commit (2026-10-25), and the site kept serving the reverted design.
  deploy-vercel:
    name: 🚀 Deploy to Vercel (production)
    needs: [quality-gate]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}
      GH_TOKEN: ${{ github.token }}
      SITE_URL: https://prismatica-eta.vercel.app
    steps:
      # The hook builds main's head, which is only this gated commit while main has not moved on;
      # if it has, the newer commit's own run deploys it once its gate passes.
      - name: Check this commit is still main's head
        id: head
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::main moved to ${head:0:7}; its own run deploys it — not deploying ${GITHUB_SHA:0:7}"; fi

      - name: Trigger the production build
        if: steps.head.outputs.current == 'true'
        run: |
          [ -n "$HOOK" ] || { echo "::error::secret VERCEL_DEPLOY_HOOK_MAIN is unset — production was not deployed"; exit 1; }
          curl -fsS -X POST "$HOOK"

      # Caveat: bounded at 15 min — a slower Vercel queue reads as a failure, re-run the job. A tag on
      # a commit behind main is not deployed (main's head is). A Vercel bot challenge (403) on the
      # runner's IP reads as "not yet" until the bound.
      - name: Wait until production serves this commit
        if: steps.head.outputs.current == 'true'
        run: |
          for _ in $(seq 90); do
            live=$(curl -fsS "$SITE_URL/" | sed -n 's/.*<meta name="prismatica-build" content="\([0-9a-f]*\)".*/\1/p')
            echo "production serves ${live:-unknown}, want $GITHUB_SHA"
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Production serves ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            sleep 10
          done
          echo "::error::production still not on ${GITHUB_SHA:0:7} after 15 min — check the Vercel build log"; exit 1
